name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Xcode & iOS Platform
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version
          xcodebuild -showsdks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install npm dependencies
        run: npm install

      - name: Patch RNFS Native Resumable Downloader
        run: |
          cp patches/Downloader.m node_modules/react-native-fs/Downloader.m || true

      - name: Patch RNFS Podspec Path Bug
        run: |
          sed -i '' "s/File.read('package.json')/File.read(File.join(__dir__, 'package.json'))/g" node_modules/react-native-fs/RNFS.podspec || true
          cp package.json ios/package.json || true

      - name: Download llama.rn Native Prebuilt Frameworks
        run: node ./node_modules/llama.rn/install/download-native-artifacts.js

      - name: Install Bundler & Gems
        run: bundle install

      - name: Install CocoaPods
        run: |
          cd ios
          bundle exec pod install || pod install --repo-update

      - name: Ensure iOS Device Platform
        run: |
          cd ios
          xcodebuild -showdestinations -workspace OfflineAI.xcworkspace -scheme OfflineAI || true
          if xcodebuild -showdestinations -workspace OfflineAI.xcworkspace -scheme OfflineAI 2>&1 | grep -q "is not installed"; then
            echo "Missing platform detected, downloading platform..."
            sudo xcodebuild -downloadPlatform iOS || true
            sudo xcodebuild -runFirstLaunch || true
          fi

      - name: Build iOS App (.app)
        run: |
          cd ios
          xcodebuild clean build \
            -workspace OfflineAI.xcworkspace \
            -scheme OfflineAI \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/OfflineAI.app Payload/
          zip -r OfflineAI.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineAI-iOS-IPA
          path: OfflineAI.ipa
          retention-days: 7
