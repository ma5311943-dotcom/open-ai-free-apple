name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install npm dependencies
        run: npm install

      - name: Patch RNFS Podspec Path Bug
        run: |
          sed -i '' "s/File.read('package.json')/File.read(File.join(__dir__, 'package.json'))/g" node_modules/react-native-fs/RNFS.podspec || true
          cp package.json ios/package.json || true

      - name: Download llama.rn Native Prebuilt Frameworks
        run: node ./node_modules/llama.rn/install/download-native-artifacts.js

      - name: Install Bundler & Gems
        run: bundle install

      - name: Install CocoaPods
        run: |
          cd ios
          bundle exec pod install || pod install --repo-update

      - name: Build iOS App (.app)
        run: |
          cd ios
          xcodebuild clean build \
            -workspace OfflineAI.xcworkspace \
            -scheme OfflineAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/OfflineAI.app Payload/
          zip -r OfflineAI.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineAI-iOS-IPA
          path: OfflineAI.ipa
          retention-days: 7
